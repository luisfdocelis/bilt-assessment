name: Quality Gates & DevSecOps

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  code-quality-and-coverage:
    name: "QG: Tests & JaCoCo Coverage (Threshold: 80%)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Maven is installed
        run: |
          if ! command -v mvn &> /dev/null; then
            apt-get update && apt-get install -y maven
          fi

      - name: Run Backend Tests with JaCoCo Quality Gate
        run: mvn --batch-mode clean test

      - name: Run Frontend Tests
        run: npm run test:web

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
        if: ${{ !env.ACT && always() }}

  static-analysis-and-sast:
    name: "QG: SAST & Security Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript Syntax & Best Practices
        run: |
          node --check web/dashboard.js
          node --check web/dashboard.test.js

      - name: Security & Antipattern Audit
        run: |
          python3 -c "
          import glob
          for f in glob.glob('src/**/*.java', recursive=True):
              content = open(f).read()
              assert 'System.out.println' not in content, f'Prohibited stdout found in {f}'
              assert 'Thread.sleep' not in content or 'test' in f, f'Prohibited sleep in {f}'
          print('SAST Static Check: Clean codebase!')
          "

  security-codeql-sast:
    name: "QG: GitHub CodeQL SAST Security Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ "java-kotlin", "javascript-typescript" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Set up Java 17 (for Java analysis)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Autobuild / Manual Build
        if: matrix.language == 'java-kotlin'
        run: mvn --batch-mode compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"


